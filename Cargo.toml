[workspace]
members = ["crates/ic-logging", "crates/ic-metrics"]
default-members = ["crates/ic-logging", "crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
version = "0.20.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-observability"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Allocation-free measurement arithmetic with validated numeric transport"

[workspace.dependencies]
# Production dependencies
ic-wire = { version = "0.10.0", default-features = false, features = ["typescript"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# Tests and tooling only
num-bigint = { version = "0.5.1", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
