[workspace]
members = ["crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.1.0"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Repository scaffold for shared Internet Computer measurement primitives"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
