[workspace]
members = ["crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.2.11"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-metrics"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Allocation-free, dependency-free measurement arithmetic"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
