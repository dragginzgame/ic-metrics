[workspace]
members = ["crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.1.7"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-metrics"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Allocation-free measurement arithmetic and an opt-in IC instruction reader"

[workspace.dependencies]
candid = "0.10.37"
ic-cdk = "0.20.3"
ic-testkit = "0.18"
ic0 = "=1.2.0"
sha2 = "0.10.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
