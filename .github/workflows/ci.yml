name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    # Cold tool setup and the complete fixture suite share this job budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
      - name: Record native qualification inputs
        id: native_inputs
        run: |
          mkdir -p target/evidence/native-ci
          {
            git rev-parse HEAD
            printf 'run=%s attempt=%s event=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            uname -s
            uname -m
          } > target/evidence/native-ci/inputs.txt
          bash scripts/ci/native-source-files.sh > target/evidence/native-ci/source-files.nul
          while IFS= read -r -d '' file; do
            shasum -a 256 -- "$file"
          done < target/evidence/native-ci/source-files.nul > target/evidence/native-ci/source-sha256.txt
      - name: Verify native host
        id: native_host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            bash scripts/ci/check-native-host.sh "$EXPECTED_OS" "$EXPECTED_ARCHITECTURE" 15
            echo /bin >> "$GITHUB_PATH"
          else
            bash scripts/ci/check-native-host.sh "$EXPECTED_OS" "$EXPECTED_ARCHITECTURE"
          fi
      - name: Install native tooling prerequisites
        id: prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update && sudo apt-get install -y xz-utils perl
              ;;
            Darwin) brew install xz ;;
            *) echo 'unsupported native host' >&2; exit 1 ;;
          esac 2>&1 | tee target/evidence/native-ci/prerequisites.log
      - name: Prepare host parsers
        id: host_tools
        run: |
          bash scripts/dev/install-host-tools.sh --consumer "$PWD" \
            2>&1 | tee target/evidence/native-ci/host-tools.log
      - name: Prepare development Rust
        id: toolchain
        run: |
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Install and verify the complete common toolset
        id: tools
        uses: ./.github/actions/prepare-common-tools
      - name: Record installed tool versions
        id: tool_inputs
        run: |
          {
            rustc --version
            cargo --version
            bash scripts/ci/report-tool-versions.sh "$GITHUB_WORKSPACE"
          } > target/evidence/native-ci/tool-versions.txt 2>&1
      - name: Prepare the locked application sources
        id: application_sources
        run: |
          cargo fetch --locked 2>&1 | tee target/evidence/native-ci/application-sources.log
      - name: Run native CI
        id: native_ci
        env:
          TMPDIR: ${{ github.workspace }}/target/evidence/native-ci/scratch
        run: |
          mkdir -p "$TMPDIR"
          make ci 2>&1 | tee target/evidence/native-ci/native-ci.log
      - name: Retain native artifacts and outcome
        id: native_artifacts
        if: always() && steps.checkout.outcome == 'success'
        env:
          APPLICATION_OUTCOME: ${{ steps.application_sources.outcome }}
          NATIVE_OUTCOME: ${{ steps.native_ci.outcome }}
          INPUT_OUTCOME: ${{ steps.native_inputs.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          HOST_OUTCOME: ${{ steps.native_host.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          HOST_TOOLS_OUTCOME: ${{ steps.host_tools.outcome }}
          TOOL_INPUT_OUTCOME: ${{ steps.tool_inputs.outcome }}
        run: |
          mkdir -p target/evidence/native-ci
          # Project the action's logs into Metrics' retained diagnostic names.
          case "$TOOLS_OUTCOME" in
            success|failure|cancelled)
              if [[ -f "$RUNNER_TEMP/tools-install.log" ]]; then
                cp "$RUNNER_TEMP/tools-install.log" target/evidence/native-ci/tools-setup.log
              fi
              if [[ -f "$RUNNER_TEMP/tools-check.log" ]]; then
                cp "$RUNNER_TEMP/tools-check.log" target/evidence/native-ci/tools-check.log
              fi ;;
          esac
          git rev-parse HEAD > target/evidence/native-ci/source-commit.txt
          printf 'native=%s\ninputs=%s\ntools=%s\nhost=%s\ntoolchain=%s\nprerequisites=%s\nhost_tools=%s\ntool_inputs=%s\napplication_sources=%s\n' \
            "$NATIVE_OUTCOME" "$INPUT_OUTCOME" "$TOOLS_OUTCOME" \
            "$HOST_OUTCOME" "$TOOLCHAIN_OUTCOME" \
            "$PREREQUISITES_OUTCOME" "$HOST_TOOLS_OUTCOME" "$TOOL_INPUT_OUTCOME" "$APPLICATION_OUTCOME" \
            > target/evidence/native-ci/outcome.txt
          # Shared mechanics; Metrics owns this explicit roster and outer Git custody.
          collection_status=0
          collection_outcome="$TOOLS_OUTCOME"
          if [[ "$HOST_TOOLS_OUTCOME" == failure ]]; then collection_outcome=failure; fi
          bash scripts/ci/collect-native-diagnostics.sh \
            "$PWD" "$PWD/target/evidence/native-ci" target/evidence/native-diagnostics.tar.gz \
            "${RUNNER_TEMP:-${TMPDIR:-/tmp}}" "$collection_outcome" \
            "$PWD/ci/tool-versions.env" "$PWD/ci/ic-tools.tsv" \
            inputs.txt source-commit.txt source-files.nul source-sha256.txt outcome.txt \
            prerequisites.log host-tools.log tools-setup.log tools-check.log tool-versions.txt application-sources.log native-ci.log || collection_status=$?
          [[ "$collection_status" != 2 ]] || exit "$collection_status"
          bash scripts/ci/collect-native-evidence.sh \
            target/evidence/native-ci target/evidence/native-ci.tar.gz
          exit "$collection_status"
      # actions/upload-artifact v7
      - name: Upload native diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-diagnostics-${{ matrix.runner }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            target/evidence/native-diagnostics.tar.gz
            target/evidence/native-diagnostics.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      # actions/upload-artifact v7
      - name: Upload native evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            target/evidence/native-ci.tar.gz
            target/evidence/native-ci.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare host parsers
        run: bash scripts/dev/install-host-tools.sh --consumer "$PWD"
      - name: Prepare minimum Rust
        id: toolchain
        run: |
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --workspace-manifest Cargo.toml --target wasm32-unknown-unknown
      - name: Check workspace native and Wasm MSRV
        run: make msrv
