name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    # Cold tool setup and the complete fixture suite share this job budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
      - name: Record native qualification inputs
        id: native_inputs
        run: |
          mkdir -p target/evidence/native-ci
          {
            git rev-parse HEAD
            printf 'run=%s attempt=%s event=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            uname -s
            uname -m
          } > target/evidence/native-ci/inputs.txt
          git ls-files Cargo.toml Cargo.lock Makefile make/tools.mk make/release.mk make/rust-format.mk make/execution.mk .shared-tooling.snapshot \
            crates/ic-metrics crates/ic-metrics-wasm-inspect .github/workflows/ci.yml \
            .github/actions/retain-failure-evidence/action.yml ci/tool-versions.env ci/ic-tools.tsv \
            scripts/dev/install-host-tools.sh scripts/dev/install-ic-tools.sh \
            scripts/dev/install-rust-tools.sh scripts/ci/test-rust-tools.sh \
            scripts/ci/ic-tool-pins.awk scripts/ci/test-native-evidence.sh \
            scripts/ci/archive-evidence.sh scripts/ci/test-evidence-archive.sh \
            scripts/ci/select-tool-evidence.sh scripts/ci/test-tool-evidence.sh \
            scripts/ci/verify-file-checksum.sh scripts/ci/verify-evidence-checksums.sh \
            scripts/ci/test-host-tools.sh scripts/ci/test-ic-tools.sh \
            scripts/ci/test-tool-commands.sh scripts/ci/test-cloc.sh \
            scripts/dev/cloc.sh \
            scripts/distribution/refresh-consumer.sh scripts/ci/run-validation-targets.sh \
            scripts/ci/run-release.sh scripts/ci/release-pr.sh scripts/ci/test-release-runner.sh \
            scripts/ci/test-release-tracking.sh \
            scripts/ci/check-release-source.sh \
            scripts/ci/finalize-release-changelog.awk \
            'scripts/release/*.sh' scripts/dev/test-format-hook.sh \
            scripts/ci/check-release-commands.sh scripts/ci/check-documentation-links.pl \
            scripts/ci/check-formatting-hooks.sh \
            scripts/ci/check-format-tools.sh scripts/ci/test-format-tools.sh scripts/ci/run-formatting.sh \
            scripts/ci/check-make-execution.sh \
            scripts/ci/read-cargo-workspace-version.sh \
            scripts/ci/rewrite-local-lock-versions.pl .githooks/pre-commit \
            scripts/dev/install-git-hooks.sh \
            > target/evidence/native-ci/source-files.txt
          while IFS= read -r file; do
            shasum -a 256 "$file"
          done < target/evidence/native-ci/source-files.txt > target/evidence/native-ci/source-sha256.txt
      - name: Verify native host
        id: native_host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "$(uname -s)" == "$EXPECTED_OS" ]] || exit 1
          [[ "$(uname -m)" == "$EXPECTED_ARCHITECTURE" ]] || exit 1
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            [[ "$(sw_vers -productVersion)" == 15.* ]] || exit 1
            echo /bin >> "$GITHUB_PATH"
          fi
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        id: toolchain
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install native tooling prerequisites
        id: prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update && sudo apt-get install -y xz-utils perl
              ;;
            Darwin) brew install xz ;;
            *) echo 'unsupported native host' >&2; exit 1 ;;
          esac 2>&1 | tee target/evidence/native-ci/prerequisites.log
      - name: Install and verify the complete common toolset
        id: tools
        run: |
          make install-tools 2>&1 | tee target/evidence/native-ci/tools-setup.log
          make tools-check 2>&1 | tee target/evidence/native-ci/tools-check.log
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
      - name: Record installed tool versions
        id: tool_inputs
        run: |
          {
            rustc --version
            cargo --version
            cargo-sort --version
            cargo-sort-derives sort-derives --version
            candid-extractor --version
            rg --version
            cloc --version
          } > target/evidence/native-ci/tool-versions.txt
      - name: Run native CI
        id: native_ci
        env:
          TMPDIR: ${{ github.workspace }}/target/evidence/native-ci/scratch
        run: |
          mkdir -p "$TMPDIR"
          make ci 2>&1 | tee target/evidence/native-ci/native-ci.log
      - name: Retain native artifacts and outcome
        id: native_artifacts
        if: always() && steps.checkout.outcome == 'success'
        env:
          NATIVE_OUTCOME: ${{ steps.native_ci.outcome }}
          INPUT_OUTCOME: ${{ steps.native_inputs.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          HOST_OUTCOME: ${{ steps.native_host.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          TOOL_INPUT_OUTCOME: ${{ steps.tool_inputs.outcome }}
        run: |
          mkdir -p target/evidence/native-ci
          git rev-parse HEAD > target/evidence/native-ci/source-commit.txt
          printf 'native=%s\ninputs=%s\ntools=%s\nhost=%s\ntoolchain=%s\nprerequisites=%s\ntool_inputs=%s\n' \
            "$NATIVE_OUTCOME" "$INPUT_OUTCOME" "$TOOLS_OUTCOME" \
            "$HOST_OUTCOME" "$TOOLCHAIN_OUTCOME" \
            "$PREREQUISITES_OUTCOME" "$TOOL_INPUT_OUTCOME" \
            > target/evidence/native-ci/outcome.txt
          if [[ -f .tools/ic/files.sha256 ]]; then
            cp .tools/ic/files.sha256 target/evidence/native-ci/ic-tool-files.sha256
            cp .tools/ic/pins.tsv target/evidence/native-ci/ic-tool-pins.tsv
            cp .tools/ic/host target/evidence/native-ci/ic-tool-host.txt
          fi
          if [[ "$TOOLS_OUTCOME" == failure ]]; then
            candidates=()
            for candidate in .tools/host-set.* .tools/ic-set.* .tools/rust; do
              if [[ -d "$candidate" ]]; then candidates+=("$PWD" "$candidate"); fi
            done
            if [[ ${#candidates[@]} != 0 ]]; then
              bash scripts/ci/archive-evidence.sh target/evidence/native-ci/tool-candidates.tar.gz "${candidates[@]}"
            fi
          fi
          # The formatter prefers RUNNER_TEMP, outside the native scratch tree.
          # Pack its retained diagnostics before hashing the native payloads.
          formatting_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          formatting_logs=()
          for log in "$formatting_root"/formatting.*; do
            if [[ -f "$log" ]]; then formatting_logs+=("$formatting_root" "${log##*/}"); fi
          done
          if [[ ${#formatting_logs[@]} != 0 ]]; then
            bash scripts/ci/archive-evidence.sh target/evidence/native-ci/formatting-logs.tar.gz "${formatting_logs[@]}"
          fi
          for file in target/evidence/native-ci/*; do
            if [[ -f "$file" && "$file" != target/evidence/native-ci/artifact-sha256.txt ]]; then
              shasum -a 256 "$file"
            fi
          done > target/evidence/native-ci/artifact-sha256.txt
          # Archive scratch names verbatim: upload-artifact rejects colons and
          # other valid fixture filenames when uploading an unpacked tree.
          # Retained release fixtures include Git intent/index state. Keep it:
          # the shared tool-candidate archiver deliberately excludes Git metadata.
          tar -czf target/evidence/native-ci.tar.gz -C target/evidence/native-ci .
          shasum -a 256 target/evidence/native-ci.tar.gz > target/evidence/native-ci.tar.gz.sha256
      # actions/upload-artifact v7
      - name: Upload native evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            target/evidence/native-ci.tar.gz
            target/evidence/native-ci.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
      - name: Check declared MSRV
        run: make msrv
      - name: Install the host inspector minimum compiler
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
      - name: Check host inspector MSRV
        run: make wasm-inspect-msrv
