name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "$(uname -s)" == "$EXPECTED_OS" ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCHITECTURE" ]]
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            [[ "$(sw_vers -productVersion)" == 15.* ]]
            echo /bin >> "$GITHUB_PATH"
          fi
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install pinned manifest formatter
        run: cargo install cargo-sort --version 2.1.4 --locked
      - name: Install native tooling prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ripgrep xz-utils
              ;;
            Darwin) brew install ripgrep xz ;;
            *) echo 'unsupported native host' >&2; exit 1 ;;
          esac
          rg --version
      - name: Install pinned local JSON, YAML and TOML parsers
        id: host_tools
        run: |
          make install-host-tools
          make host-tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Run native CI
        id: native_ci
        run: |
          mkdir -p target/evidence/reader
          make ci 2>&1 | tee target/evidence/reader/native-ci.log
      - name: Record reader inputs and prepare locked dependencies
        id: reader_inputs
        run: |
          mkdir -p target/evidence/reader
          {
            git rev-parse HEAD
            printf 'run=%s attempt=%s event=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            uname -s
            uname -m
            rustc --version
            cargo --version
          } > target/evidence/reader/inputs.txt
          git ls-files Cargo.toml Cargo.lock Makefile .shared-tooling.snapshot \
            crates/ic-metrics .github/workflows/ci.yml ci/tool-versions.env ci/ic-tools.tsv \
            scripts/dev/install-host-tools.sh scripts/dev/install-ic-tools.sh \
            scripts/ci/verify-file-checksum.sh scripts/ci/verify-evidence-checksums.sh \
            scripts/ci/test-host-tools.sh scripts/ci/test-ic-tools.sh \
            > target/evidence/reader/source-files.txt
          while IFS= read -r file; do
            shasum -a 256 "$file"
          done < target/evidence/reader/source-files.txt > target/evidence/reader/source-sha256.txt
          cargo fetch --locked 2>&1 | tee target/evidence/reader/fetch.log
      - name: Provision and verify the pinned local IC tool set
        id: reader_provision
        run: |
          make install-ic-tools > target/evidence/reader/provision.log 2>&1
          make ic-tools-check >> target/evidence/reader/provision.log 2>&1
          cat target/evidence/reader/provision.log
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          printf 'POCKET_IC_BIN=%s\n' "$GITHUB_WORKSPACE/.tools/ic/bin/pocket-ic" >> "$GITHUB_ENV"
      - name: Execute instruction-reader qualification
        id: reader_execution
        run: |
          CARGO_NET_OFFLINE=true make reader-check POCKET_IC_BIN="$POCKET_IC_BIN" \
            2>&1 | tee target/evidence/reader/qualification.log
      - name: Retain reader artifacts and outcome
        if: always() && steps.native_ci.outcome != 'skipped'
        env:
          NATIVE_OUTCOME: ${{ steps.native_ci.outcome }}
          INPUT_OUTCOME: ${{ steps.reader_inputs.outcome }}
          PROVISION_OUTCOME: ${{ steps.reader_provision.outcome }}
          EXECUTION_OUTCOME: ${{ steps.reader_execution.outcome }}
        run: |
          mkdir -p target/evidence/reader
          git rev-parse HEAD > target/evidence/reader/source-commit.txt
          printf 'native=%s\ninputs=%s\nprovision=%s\nexecution=%s\n' \
            "$NATIVE_OUTCOME" "$INPUT_OUTCOME" "$PROVISION_OUTCOME" "$EXECUTION_OUTCOME" > target/evidence/reader/outcome.txt
          if [[ -f .tools/ic/files.sha256 ]]; then
            cp .tools/ic/files.sha256 target/evidence/reader/ic-tool-files.sha256
            cp .tools/ic/pins.tsv target/evidence/reader/ic-tool-pins.tsv
            cp .tools/ic/host target/evidence/reader/ic-tool-host.txt
          fi
          wasm=target/wasm32-unknown-unknown/release/examples/ic_reader_canister.wasm
          if [[ -f "$wasm" ]]; then
            cp "$wasm" target/evidence/reader/ic_reader_canister.wasm
          fi
          {
            if [[ -n "${POCKET_IC_BIN:-}" && -f "$POCKET_IC_BIN" ]]; then
              shasum -a 256 "$POCKET_IC_BIN"
            fi
            for file in target/evidence/reader/*.log target/evidence/reader/*.wasm target/debug/deps/ic_reader-*; do
              if [[ -f "$file" && "$file" != *.d ]]; then
                shasum -a 256 "$file"
              fi
            done
          } > target/evidence/reader/artifact-sha256.txt
      # actions/upload-artifact v7
      - name: Upload reader evidence
        if: always() && steps.native_ci.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ic-reader-${{ matrix.runner }}-${{ github.run_attempt }}
          path: target/evidence/reader/
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed local tool candidates
        if: failure() && (steps.host_tools.outcome == 'failure' || steps.reader_provision.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tool-install-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            .tools/host-set.*/
            .tools/ic-set.*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Check declared MSRV
        run: make msrv
