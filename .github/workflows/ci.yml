name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "$(uname -s)" == "$EXPECTED_OS" ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCHITECTURE" ]]
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            [[ "$(sw_vers -productVersion)" == 15.* ]]
            echo /bin >> "$GITHUB_PATH"
          fi
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install pinned manifest formatter
        run: cargo install cargo-sort --version 2.1.4 --locked
      - name: Install native tooling prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ripgrep xz-utils
              ;;
            Darwin) brew install ripgrep xz ;;
            *) echo 'unsupported native host' >&2; exit 1 ;;
          esac
          rg --version
      - name: Install pinned local JSON, YAML and TOML parsers
        id: host_tools
        run: |
          make install-host-tools
          make host-tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Record native qualification inputs
        id: native_inputs
        run: |
          mkdir -p target/evidence/native-ci
          {
            git rev-parse HEAD
            printf 'run=%s attempt=%s event=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
            uname -s
            uname -m
            rustc --version
            cargo --version
          } > target/evidence/native-ci/inputs.txt
          git ls-files Cargo.toml Cargo.lock Makefile .shared-tooling.snapshot \
            crates/ic-metrics .github/workflows/ci.yml ci/tool-versions.env ci/ic-tools.tsv \
            scripts/dev/install-host-tools.sh scripts/dev/install-ic-tools.sh \
            scripts/ci/verify-file-checksum.sh scripts/ci/verify-evidence-checksums.sh \
            scripts/ci/test-host-tools.sh scripts/ci/test-ic-tools.sh \
            > target/evidence/native-ci/source-files.txt
          while IFS= read -r file; do
            shasum -a 256 "$file"
          done < target/evidence/native-ci/source-files.txt > target/evidence/native-ci/source-sha256.txt
      - name: Provision and verify the pinned local IC tool set
        id: ic_tools
        run: |
          make install-ic-tools 2>&1 | tee target/evidence/native-ci/provision.log
          make ic-tools-check 2>&1 | tee -a target/evidence/native-ci/provision.log
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Run native CI
        id: native_ci
        run: |
          make ci 2>&1 | tee target/evidence/native-ci/native-ci.log
      - name: Retain native artifacts and outcome
        if: always() && steps.native_inputs.outcome != 'skipped'
        env:
          NATIVE_OUTCOME: ${{ steps.native_ci.outcome }}
          INPUT_OUTCOME: ${{ steps.native_inputs.outcome }}
          PROVISION_OUTCOME: ${{ steps.ic_tools.outcome }}
        run: |
          mkdir -p target/evidence/native-ci
          git rev-parse HEAD > target/evidence/native-ci/source-commit.txt
          printf 'native=%s\ninputs=%s\nprovision=%s\n' \
            "$NATIVE_OUTCOME" "$INPUT_OUTCOME" "$PROVISION_OUTCOME" > target/evidence/native-ci/outcome.txt
          if [[ -f .tools/ic/files.sha256 ]]; then
            cp .tools/ic/files.sha256 target/evidence/native-ci/ic-tool-files.sha256
            cp .tools/ic/pins.tsv target/evidence/native-ci/ic-tool-pins.tsv
            cp .tools/ic/host target/evidence/native-ci/ic-tool-host.txt
          fi
          for file in target/evidence/native-ci/*.log; do
            if [[ -f "$file" ]]; then
              shasum -a 256 "$file"
            fi
          done > target/evidence/native-ci/artifact-sha256.txt
      # actions/upload-artifact v7
      - name: Upload native evidence
        if: always() && steps.native_inputs.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}-${{ github.run_attempt }}
          path: target/evidence/native-ci/
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed local tool candidates
        if: failure() && (steps.host_tools.outcome == 'failure' || steps.ic_tools.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tool-install-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            .tools/host-set.*/
            .tools/ic-set.*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - name: Check declared MSRV
        run: make msrv
